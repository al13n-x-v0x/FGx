# Render configuration for FGx Discord Bot
services:
  - type: web
    name: fgx
    runtime: node
    plan: free
    env: node
    region: oregon
    buildCommand: npm install
    startCommand: node src/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DISCORD_INTENTS
        value: full
      - key: MC_SERVER_HOST
        value: FGxx.aternos.me
      - key: MC_SERVER_PORT
        value: '25565'
      - key: MC_SERVER_NAME
        value: FGxx Aternos Server
      - key: AI_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        value: ''
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: HF_API_KEY
        value: ''
      - key: HF_MODEL
        value: 'mistralai/Mistral-7B-Instruct-v0.3'
      - key: ATERNOS_USERNAME
        sync: false
      - key: ATERNOS_PASSWORD
        sync: false
