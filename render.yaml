# Render configuration for FGx Discord Bot
services:
  - type: web
    name: fgx
    runtime: node
    plan: free
    env: node
    region: oregon
    buildCommand: npm install
    startCommand: node src/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DISCORD_INTENTS
        value: full
      - key: MC_SERVER_HOST
        value: FGxx.aternos.me
      - key: MC_SERVER_PORT
        value: '25565'
      - key: MC_SERVER_NAME
        value: FGxx Aternos Server
      - key: AI_PROVIDER
        value: gemini
        sync: false
      - key: GEMINI_API_KEY
        value: ''
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: OPENROUTER_API_KEY
        value: ''
        sync: false
      - key: GUILD_ID
        value: ''
        sync: false
      - key: ATERNOS_USERNAME
        sync: false
      - key: ATERNOS_PASSWORD
        sync: false
